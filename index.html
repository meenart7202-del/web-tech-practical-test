<body>

  <!--

    Question Title    :SHOPPING CART ITEMS TABLE

    YOUR TASK (paste from QUESTIONS.docx):
    Build a SHOPPING CART TABLE. Columns: Product Image, Name, Price, Quantity (number input), Subtotal,
Remove (link/x). Footer row with Total and a 'Checkout' button. Build the page with valid HTML5 (DOCTYPE,
lang, charset, viewport, page title) using semantic elements (header, main, footer, and section/article/nav
where they fit). Put all styles in styles.css — NO inline style attributes and NO <style> tags in the HTML. Use
Flexbox or CSS Grid for the layout. Include at least 2 images (each with descriptive alt text — you may use the
SVGs in assets/images/ or upload your own under that folder) and at least 2 working links, where at least one
is an external link that opens in a new tab with rel="noopener noreferrer". Define your colours using CSS
variables (custom properties). Add hover effects on interactive elements (links, buttons, cards). Add at least
one @media query so the page still works on a 375px-wide phone screen. Write your full name, registration
number, and question number in the top comment of both files and in the page footer. Do NOT use JavaScript
and do NOT use any CSS framework (Bootstrap, Tailwind, etc.) — pure HTML + CSS only

    REQUIREMENTS FOR EVERY QUESTION:
    1. Use semantic HTML5 (header, main, footer, section, article where appropriate).
    2. Style everything in styles.css — NO inline styles, NO <style> tag.
    3. Use Flexbox or CSS Grid for layout (whichever fits your component).
    4. Include AT LEAST 2 images (use /assets/images/ or your own).
    5. Include AT LEAST 2 working links (internal or external).
    6. Add hover effects on interactive elements (links, buttons).
    7. The page must look reasonable on mobile (add one media query).
    8. No JavaScript required (HTML + CSS only).
    ============================================================
  -->
    <header>
        <h1>Shopping Cart Table</h1>
    </header>
    <main>
    <table border="1">
        <thead>
            <tr>
                <th>Product Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity(number input)</th>
                <th>Subtotal</th>
                <th>Remove(link/x)</th>
            </tr>
        </thead>
        <tbody>
           <tr>
            <td><img src="image.jpg" alt="Cat" width="70px" height="50"></td>
            <td>Rice</td>
            <td>2000</td>
            <td><input type="number" value="0"></td>
            <td>2000</td>
            <td><a href="#">Remove</a></td>
           </tr>

           <tr>
            <td><img src="coffee.png" alt="Coffee" width="70px"></td>
            <td>Coffee</td>
            <td>3000</td>
            <td><input type="number" value="0"></td>
            <td>3000</td>
            <td><a href="#">Remove</a></td>
           </tr>
           <tr>
            <td colspan="6">
                <footer>
                   <button class="btntotal">Total: 5000</button>
                   <button>Checkout</button>
                </footer>
            </td>
           </tr>
        </tbody>
    </table>
    </main>
